{% extends "base.html" %}
{% block title %}Deck - Mastoferr{% endblock %}

{% block content %}
<div class="deck-layout">

    <div class="deck-toolbar">
        <div class="deck-title">
            <h1>&#128450; Deck View</h1>
            <span class="deck-subtitle">Modular Mastodon Client</span>
        </div>
        <div class="deck-actions">
            <button class="btn btn-primary btn-sm" onclick="openAddColumnModal()" title="Add custom feed or hashtag column">&#10133; Add Column</button>
            <button class="btn btn-secondary btn-sm" onclick="refreshAllColumns()" title="Refresh all feeds">&#8634; Refresh All</button>
            <button class="btn btn-secondary btn-sm" onclick="resetDeckLayout()" title="Reset layout to default columns">&#9881; Reset</button>
            <button class="btn btn-sync btn-sm" onclick="triggerSync()">&#8635; Sync</button>
        </div>
    </div>

    <!-- Dynamic Modular Columns Track -->
    <div class="deck-scroll-wrapper" id="deck-scroll-wrapper">
        <div class="deck-loading" style="padding: 2rem; color: var(--text-muted);">
            <span class="spinner"></span> Initializing Deck workspace...
        </div>
    </div>

</div>

<!-- Compose Column Shell Template (injected into Column 0) -->
<template id="deck-compose-template">
    <div class="deck-profile-card">
        {% if account.avatar %}
        <img src="{{ account.avatar }}" alt="{{ account.display_name }}" class="deck-avatar">
        {% else %}
        <div class="deck-avatar-placeholder">&#128100;</div>
        {% endif %}
        <div class="deck-profile-info">
            <div class="deck-display-name">{{ account.display_name }}</div>
            <div class="deck-acct">@{{ account.acct }}</div>
        </div>
    </div>

    <form id="deck-compose-form" class="deck-compose-form" onsubmit="submitDeckToot(event)">
        <div class="compose-cw-box" id="compose-cw-box" style="display:none;">
            <input type="text" id="compose-spoiler" class="compose-input-cw" placeholder="Write your content warning here...">
        </div>

        <textarea id="compose-text" class="compose-textarea" placeholder="What's on your mind? (Paste images with Ctrl+V)" rows="4" maxlength="500"></textarea>

        <!-- Media Attachment Preview Grid -->
        <div class="compose-media-previews" id="compose-media-previews" style="display:none;"></div>
        <div class="compose-upload-status" id="compose-upload-status" style="display:none;"></div>

        <input type="file" id="compose-file-input" multiple accept="image/*,video/*,audio/*" style="display:none;" onchange="handleFileSelect(event)">

        <div class="compose-footer">
            <div class="compose-tools">
                <button type="button" class="btn-tool" id="btn-attach-media" onclick="triggerFileSelect()" title="Attach images or videos (up to 4)">&#128206; <span id="attach-count" class="attach-badge" style="display:none;">0</span></button>
                <button type="button" class="btn-tool" id="btn-cw-toggle" onclick="toggleCW()" title="Content Warning">&#9888; CW</button>
                <select id="compose-visibility" class="compose-select-visibility" title="Visibility">
                    <option value="public" {% if default_visibility == 'public' %}selected{% endif %}>&#127760; Public</option>
                    <option value="unlisted" {% if default_visibility == 'unlisted' %}selected{% endif %}>&#128275; Unlisted</option>
                    <option value="private" {% if default_visibility == 'private' %}selected{% endif %}>&#128274; Followers only</option>
                    <option value="direct" {% if default_visibility == 'direct' %}selected{% endif %}>&#9993; Direct</option>
                </select>
            </div>
            <div class="compose-submit-wrap">
                <span id="compose-chars" class="compose-chars">500</span>
                <button type="submit" id="compose-submit-btn" class="btn btn-primary btn-sm">&#128640; Publish</button>
            </div>
        </div>
        <div id="compose-feedback" class="compose-feedback" style="display:none;"></div>
    </form>

    <div class="deck-side-stats">
        <div class="deck-mini-stat">
            <span class="val">{{ stats.toots }}</span>
            <span class="lbl">Toots</span>
        </div>
        <div class="deck-mini-stat">
            <span class="val">{{ stats.notifications }}</span>
            <span class="lbl">Notifs</span>
        </div>
        <div class="deck-mini-stat">
            <span class="val">{{ stats.favorites }}</span>
            <span class="lbl">Favs</span>
        </div>
        <div class="deck-mini-stat">
            <span class="val">{{ stats.bookmarks }}</span>
            <span class="lbl">Saved</span>
        </div>
    </div>

    <div class="deck-quick-links">
        <h3>Quick Shortcuts</h3>
        <a href="/toots">&#128172; Full Archive Search &rarr;</a>
        <a href="/notifications">&#128276; All Notifications &rarr;</a>
        <a href="/followers">&#128101; Followers & Stalkers &rarr;</a>
        <a href="/queue">&#9203; Post Queue &rarr;</a>
    </div>
</template>

<script src="/static/deck.js?v={{ APP_VERSION }}"></script>
{% endblock %}
